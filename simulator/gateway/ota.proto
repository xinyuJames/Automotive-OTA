syntax = "proto3";

package ota;

service OtaControl {
  rpc RegisterVehicle (VehicleRecord) returns (JsonRecord);
  rpc GetVehicle (VehicleRequest) returns (JsonRecord);
  rpc ReportInventory (InventoryRecord) returns (CheckInResponse);
  rpc RecordVehicleEvent (VehicleEvent) returns (CheckInResponse);
  rpc ListPendingJobs (VehicleRequest) returns (JsonRecord);
  rpc CheckIn (CheckInRequest) returns (CheckInResponse);
  rpc RegisterManifest (RegisterManifestRequest) returns (RegisterManifestResponse);
  rpc UpdateJobStatus (UpdateJobStatusRequest) returns (UpdateJobStatusResponse);
  rpc GetManifest (GetManifestRequest) returns (GetManifestResponse);
  rpc ConfirmEmergencyStop (ConfirmEmergencyStopRequest) returns (ConfirmEmergencyStopResponse);
  rpc CreateJob (CreateJobRequest) returns (CreateJobResponse);
}

message CheckInRequest {
  string vehicle_id = 1;
}

message CheckInResponse {
  bool ok = 1;
}

message RegisterManifestRequest {
  string manifest_json = 1;      // Full JSON content
  string signature = 2;          // Ed25519 signature
  string manifest_ref = 3;       // Reference ID
}

message RegisterManifestResponse {
  bool success = 1;
  string message = 2;
}

message UpdateJobStatusRequest {
  string job_id = 1;
  string status = 2;
  string details = 3;
}

message UpdateJobStatusResponse {
  bool received = 1;
}

message GetManifestRequest {
  string manifest_ref = 1;
}

message GetManifestResponse {
  string manifest_json = 1;
  string signature = 2;
  bool found = 3;
}

message ConfirmEmergencyStopRequest {
  string request_id = 1;
  string vehicle_id = 2;
  string status = 3; // e.g. "STOPPED"
}

message ConfirmEmergencyStopResponse {
  bool acknowledged = 1;
}

message CreateJobRequest {
  string campaign_id = 1;
  string vehicle_id = 2;
}

message CreateJobResponse {
  string job_id = 1;
  bool created = 2;
}

// Artifact bytes and vehicle records belong to this service, never shared volumes.
service ArtifactStore {
  rpc ListReleases (Empty) returns (JsonRecord);
  rpc ReadFirmware (FirmwareRequest) returns (FirmwareData);
  rpc PutArtifact (ArtifactData) returns (JsonRecord);
  rpc RegisterVehicle (VehicleRecord) returns (JsonRecord);
  rpc GetVehicle (VehicleRequest) returns (JsonRecord);
  rpc ReportInventory (InventoryRecord) returns (CheckInResponse);
  rpc RecordVehicleEvent (VehicleEvent) returns (CheckInResponse);
  rpc CheckIn (CheckInRequest) returns (CheckInResponse);
  rpc RegisterManifest (RegisterManifestRequest) returns (RegisterManifestResponse);
  rpc GetManifest (GetManifestRequest) returns (GetManifestResponse);
  rpc CreateJob (CreateJobRequest) returns (CreateJobResponse);
  rpc UpdateJobStatus (UpdateJobStatusRequest) returns (UpdateJobStatusResponse);
  rpc ListPendingJobs (VehicleRequest) returns (JsonRecord);
}
message Empty {}
message JsonRecord { string json = 1; }
message VehicleRequest { string vehicle_id = 1; }
message VehicleRecord { string vehicle_id = 1; string profile_json = 2; }
message InventoryRecord { string vehicle_id = 1; string ecu_id = 2; string inventory_json = 3; }
message VehicleEvent { string vehicle_id = 1; string event_id = 2; string kind = 3; string details_json = 4; }
message FirmwareRequest { string ecu_id = 1; string version = 2; }
message FirmwareData { bytes content = 1; string metadata_json = 2; }
message ArtifactData { bytes content = 1; string sha256 = 2; }
